#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "freescout"
name = "FreeScout"
description.en = "Help desk & shared mailbox"
description.fr = "Service d'assistance et boîte aux lettres partagée"

version = "1.8.235~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-only"
website = "https://freescout.net/"
demo = "https://demo.freescout.net/login"
admindoc = "https://github.com/freescout-helpdesk/freescout/wiki/Installation-Guide"
code = "https://github.com/freescout-helpdesk/freescout"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/freescout-helpdesk/freescout/archive/refs/tags/1.8.235.tar.gz"
    sha256 = "3a004f030bd5c17a8f92beaaa76267ef70be3a5cad9fe7dfc5d90644d5a4f89d"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server, php8.5-mysql, php8.5-mbstring, php8.5-xml, php8.5-imap, php8.5-zip, php8.5-gd, php8.5-curl, php8.5-intl"

    [resources.database]
    type = "mysql"
